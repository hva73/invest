name: Desktop release visual review
on: [pull_request]
permissions:
  contents: read
jobs:
  desktop-review:
    if: github.event.pull_request.head.ref == 'codex/approved-mobile-visual-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:tests
      ESCAPE_PLAYWRIGHT_MANAGED: '1'
      ESCAPE_SCREENSHOTS: visual-review
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_desktop_experience.py
      - run: python tests/browser_sector_journey.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-release-review
          path: visual-review/**
          if-no-files-found: warn
