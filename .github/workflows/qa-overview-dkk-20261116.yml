name: Verify DKK overview calculations and mobile ordering
on:
  pull_request:
    branches: [hotfix/baseline-overview-consistency-20261116]
permissions:
  contents: read
jobs:
  overview:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest tests.test_design_v1_acceptance tests.test_mobile_projection
      - run: node --check static/dashboard-ui.js
      - run: node tests/test_dashboard_data.js
      - run: python tests/browser_positions.py
      - run: python tests/browser_design_v1.py
