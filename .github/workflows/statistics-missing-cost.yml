name: Statistics missing cost review
on:
  pull_request:
    branches: [codex/data-and-notification-prep]
permissions:
  contents: read
jobs:
  check:
    if: github.event.pull_request.head.ref == 'codex/statistics-unresolved-sales-142'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_realized_statistics.py'
      - run: python -m unittest discover -s tests -p 'test_statistics_missing_cost.py'
      - run: node tests/test_statistics_missing_cost.cjs
      - run: python tests/browser_statistics_missing_cost.py
