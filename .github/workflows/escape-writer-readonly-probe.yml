name: ESCAPE writer GraphQL read-only probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.repository == 'hva73/invest' &&
      github.actor_id == '351122234' &&
      github.event.issue.number == 4 &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, 'ESCAPE_PROJECTS_DRYRUN_V1 {"request_id":"9f3d52aab8d04b9ca256152fa8cc8160"')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed read-only probe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4b526d2a16cd4e6967a964d0bc54b5e704c5068d
          persist-credentials: false
      - name: Validate actual project query without mutation
        env:
          ESCAPE_PROJECTS_TOKEN: ${{ secrets.ESCAPE_PROJECTS_TOKEN }}
          REQUEST_COMMENT_ID: ${{ github.event.comment.id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 development/projects_status_write_readonly_probe.py
