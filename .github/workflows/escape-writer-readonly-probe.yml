name: ESCAPE writer GraphQL read-only probe

on:
  workflow_dispatch:
    inputs:
      comment_id:
        description: Existing Issue 4 request comment ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.repository == 'hva73/invest' &&
      github.actor_id == '351122234' &&
      github.ref == 'refs/heads/codex/escape-development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed read-only probe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4b526d2a16cd4e6967a964d0bc54b5e704c5068d
          persist-credentials: false
      - name: Validate actual project query without mutation
        env:
          ESCAPE_PROJECTS_TOKEN: ${{ secrets.ESCAPE_PROJECTS_TOKEN }}
          REQUEST_COMMENT_ID: ${{ inputs.comment_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 development/projects_status_write_readonly_probe.py
