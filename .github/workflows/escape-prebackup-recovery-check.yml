name: Pre-backup recovery offline checks
on:
  pull_request:
    branches: [codex/issue57-legacy-ticket]
permissions:
  contents: read
jobs:
  recovery:
    if: github.repository == 'hva73/invest' && github.event.pull_request.head.ref == 'codex/issue57-prebackup-recovery-4'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_recover_a708_prebackup.py' -v
