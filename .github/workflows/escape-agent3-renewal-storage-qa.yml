name: ESCAPE agent3 renewal storage QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [codex/issue57-combined-release-20261124]
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'hva73/invest' && github.event.pull_request.head.ref == 'codex/agent3-no-data-renewal-storage-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Exact head and offline ingest tests
        env:
          PYTHONPATH: .:tests
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m unittest -v tests.test_hotwatch_engine.HotWatch.test_compact_renewal_audit_roundtrip_and_same_feed_storage tests.test_hotwatch_engine.HotWatch.test_compact_renewal_audit_excludes_action_critical_and_invalid_encoding
      - name: Existing safety regression
        env:
          PYTHONPATH: .:tests
        run: python -m unittest tests.test_hotwatch_engine tests.test_hotwatch_bar_evidence tests.test_candidate_lifecycle tests.test_hotwatch_buy_plan tests.test_web_push tests.test_strategy_lab
