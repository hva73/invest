name: ESCAPE deploy public key
on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [codex/escape-development]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'pull_request' && github.repository == 'hva73/invest'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public key derivation
        run: |
          set -eu
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/test-key"
          ssh-keygen -y -f "$RUNNER_TEMP/test-key" | ssh-keygen -lf -
  public_key:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'hva73/invest' &&
      github.event.issue.number == 16 &&
      github.event.comment.user.id == 351122234 &&
      github.event.comment.body == '/escape-deploy-public-key'
    runs-on: ubuntu-latest
    environment: ESCAPE_NORDICWAY_DEPLOY
    timeout-minutes: 2
    steps:
      - name: Derive only the public key
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.ESCAPE_NORDICWAY_DEPLOY_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077
          key="$RUNNER_TEMP/escape-deploy-key"
          trap 'rm -f "$key"' EXIT
          test -n "$DEPLOY_PRIVATE_KEY"
          python3 -c 'import os,json; v=os.environ.get("DEPLOY_PRIVATE_KEY",""); print(json.dumps({"begin":v.startswith("-----BEGIN OPENSSH PRIVATE KEY-----"), "end":"-----END OPENSSH PRIVATE KEY-----" in v, "multiline":chr(10) in v, "literal_backslash_n":chr(92)+chr(110) in v}))'
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$key"
          unset DEPLOY_PRIVATE_KEY
          ssh-keygen -y -f "$key"
      - name: Verify dedicated SSH ping
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.ESCAPE_NORDICWAY_DEPLOY_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077
          key="$RUNNER_TEMP/deploy-ping-key"
          hosts="$RUNNER_TEMP/deploy-ping-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$key"
          ssh-keyscan -T 10 -t ed25519 -p 33 cp14.nordicway.dk > "$hosts" 2>/dev/null
          unset DEPLOY_PRIVATE_KEY
          fingerprint="$(ssh-keygen -lf "$hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:U8MQZwyzMoDmDyRnBIqFqN14BVifmGKNSi+7B8OACDI'
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -p 33 nordicr4@cp14.nordicway.dk 'escape-deploy-v1 ping'

  write_probe:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'hva73/invest' &&
      github.event.issue.number == 16 &&
      github.event.comment.user.id == 351122234 &&
      github.event.comment.body == '/escape-deploy-write-probe'
    runs-on: ubuntu-latest
    environment: ESCAPE_NORDICWAY_DEPLOY
    timeout-minutes: 2
    steps:
      - name: Run restricted SSH write probe
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.ESCAPE_NORDICWAY_DEPLOY_PRIVATE_KEY }}
          WRITE_PROBE_AUTHORIZED: ${{ vars.ESCAPE_WRITE_PROBE_AUTHORIZED }}
        run: |
          set -eu
          umask 077
          test "$WRITE_PROBE_AUTHORIZED" = 1
          test -n "$DEPLOY_PRIVATE_KEY"
          key="$RUNNER_TEMP/deploy-probe-key"
          hosts="$RUNNER_TEMP/deploy-probe-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$key"
          unset DEPLOY_PRIVATE_KEY
          ssh-keyscan -T 10 -t ed25519 -p 33 cp14.nordicway.dk > "$hosts" 2>/dev/null
          fingerprint="$(ssh-keygen -lf "$hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:U8MQZwyzMoDmDyRnBIqFqN14BVifmGKNSi+7B8OACDI'
          reply="$(ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -p 33 nordicr4@cp14.nordicway.dk 'escape-deploy-v1 write-probe')"
          printf '%s\n' "$reply" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d == {"operation":"write_probe","status":"ok"}; print("write_probe:ok")'
