name: ESCAPE mobile experience checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [codex/escape-development]
permissions:
  contents: read
jobs:
  mobile-experience:
    if: github.repository == 'hva73/invest' && (github.event.pull_request.head.ref == 'codex/issue63-anonymous-demo' || github.event.pull_request.head.ref == 'codex/issue54-signal-decision-ux' || github.event.pull_request.head.ref == 'codex/issue54-mobile-v24' || github.event.pull_request.head.ref == 'codex/mobile-experience-2' || github.event.pull_request.head.ref == 'codex/issue57-release-management' || github.event.pull_request.head.ref == 'codex/issue67-desktop-experience')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install browser test dependency
        run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test navigation and simulated review
        env:
          ESCAPE_PLAYWRIGHT_MANAGED: '1'
          ESCAPE_SCREENSHOTS: /tmp/escape-mobile-screens
          PYTHONPATH: .:tests
        run: |
          node tests/test_dashboard_data.js
          node tests/test_dashboard_attention.js
          node tests/test_signal_notice.js
          node tests/test_quick_review.cjs
          node tests/test_demo_boundary.cjs
          node tests/test_signal_direction_guard.cjs
          node tests/test_signal_detail_context.cjs
          node tests/test_signal_buy_context.cjs
          node tests/test_notification_ui.cjs
          node tests/test_notification_sale_review.cjs
          python -m unittest test_trade_service test_hotwatch_buy_plan test_mobile_projection
          node tests/test_market_expansion.cjs
          node tests/test_holding_chart_marker.cjs
          python tests/browser_mobile_layout.py
          python tests/browser_mobile_review.py
          python tests/browser_mobile_navigation_app.py
          python tests/browser_mobile_decision_overview.py
          python tests/browser_signal_push_detail.py
          python tests/browser_asset_trade.py
          python tests/browser_quick_trade.py
          python tests/browser_anonymous_demo.py
          python -m unittest discover -s tests -p test_anonymous_demo.py
      - name: Upload synthetic screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: escape-mobile-screens
          path: /tmp/escape-mobile-screens/
          if-no-files-found: ignore
          retention-days: 7
