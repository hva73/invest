name: ESCAPE phone deployment client tests
on:
  pull_request:
    branches: [codex/escape-development]
permissions:
  contents: read
jobs:
  tests:
    if: github.repository == 'hva73/invest' && contains(fromJSON('["codex/issue57-app-deploy-client","codex/phone-client-with-fallback"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Test fixed requests and transport
        env:
          PYTHONPATH: tools:.
        run: python -m unittest tests.test_nordicway_deploy_request tests.test_nordicway_deploy_client tests.test_nordicway_hostkey
