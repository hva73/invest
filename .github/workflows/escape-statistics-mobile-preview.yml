name: Statistics mobile layout check
on:
  pull_request:
    branches: [codex/issue114-statistics]
permissions:
  contents: read
jobs:
  mobile:
    if: github.event.pull_request.head.ref == 'codex/statistics-mobile-layout'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: mkdir -p "$ESCAPE_SCREENSHOTS" && node tests/test_statistics_ui.cjs && python tests/browser_statistics_integration.py
        env:
          ESCAPE_SCREENSHOTS: /tmp/statistics-mobile
          PYTHONPATH: .:tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: statistics-mobile-synthetic
          path: /tmp/statistics-mobile
          if-no-files-found: ignore
          retention-days: 7
