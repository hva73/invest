name: ESCAPE integrated release checks
on:
  pull_request:
    branches: [codex/escape-development]
permissions:
  contents: read
jobs:
  integration:
    if: github.event.pull_request.head.ref == 'codex/issue57-integrated-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out pinned approval bridge for offline integration test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2637dcb4c69487375f83bfca2091b5c88e9baf86
          path: _bridge
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify bridge updater matches this release
        run: cmp apply_update.py _bridge/apply_update.py
      - name: Data, broker and signal regression
        env:
          PYTHONPATH: .:tests
        run: python -m unittest tests.test_updater tests.test_post_install_capacity tests.test_realized_statistics tests.test_release_approval tests.test_nordicway_app_release tests.test_app.Workflow.test_release_approval_requires_owner_session_csrf_and_exact_version tests.test_web_push.Push.test_release_notification_only_for_owner_with_current_candidate tests.test_hotwatch_engine tests.test_hotwatch_holdings_auto tests.test_hotwatch_buy_plan tests.test_trade_service tests.test_nordicway_uapi_probe tests.test_nordicway_uapi_quota
      - name: Mobile, desktop and sector unit checks
        run: |
          node tests/test_push_service_worker.js
          node tests/test_statistics_ui.cjs
          node tests/test_statistics_desktop_review.cjs
          node tests/test_dashboard_data.js
          node tests/test_dashboard_attention.js
          node tests/test_sector_ui.js
          node tests/test_notification_ui.cjs
          node tests/test_signal_buy_context.cjs
          node tests/test_signal_direction_guard.cjs
          node tests/test_quick_review.cjs
          node tests/test_notification_sale_review.cjs
      - name: Browser journeys with synthetic data
        env:
          ESCAPE_PLAYWRIGHT_MANAGED: '1'
          PYTHONPATH: .:tests
        run: |
          python tests/browser_statistics_integration.py
          python tests/browser_statistics_desktop_accept.py
          python tests/browser_release_approval.py
          python tests/browser_release_bridge_end_to_end.py
          python tests/browser_mobile_decision_overview.py
          python tests/browser_signal_push_detail.py
          python tests/browser_signal_sell_server.py
          python tests/browser_desktop_experience.py
          python tests/browser_sector_cash.py
          python tests/browser_sector_journey.py
          python tests/review_integrated_decision.py
