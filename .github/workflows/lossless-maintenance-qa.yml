name: Lossless 20GB maintenance QA (offline only)
on:
  pull_request:
    branches: [codex/issue57-combined-release-20261124]
permissions:
  contents: read
jobs:
  offline:
    if: github.event.pull_request.head.ref == 'codex/issue57-lossless-maintenance-20gb'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -B tools/nordicway_lossless_maintenance.py --self-test
