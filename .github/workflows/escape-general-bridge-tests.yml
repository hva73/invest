name: ESCAPE general Projects bridge tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [codex/escape-development]

permissions:
  contents: read

concurrency:
  group: escape-projects-general-bridge-ci
  queue: max
  cancel-in-progress: false

jobs:
  tests:
    if: >-
      github.repository == 'hva73/invest' &&
      (github.event.pull_request.head.ref == 'codex/projects-general-status-bridge' ||
       github.event.pull_request.head.ref == 'codex/activate-general-projects-bridge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed PR revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run simulated multi-issue and existing checks
        run: >-
          python3 -m unittest
          tests.test_projects_status_single_test
          tests.test_projects_general_bridge
          tests.test_projects_dryrun
          tests.test_projects_replay_claim
          tests.test_projects_status_write_prototype
          tests.test_projects_status_write_runner
          tests.test_projects_status_write_audit
          tests.test_projects_status_write_integration
          tests.test_projects_status_write_entry
