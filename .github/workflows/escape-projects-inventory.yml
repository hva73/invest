name: ESCAPE Projects backlog inventory

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  inventory:
    if: >-
      github.repository == 'hva73/invest' &&
      github.actor_id == '351122234' &&
      github.ref == 'refs/heads/codex/escape-development' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.number == 11 &&
        github.event.issue.pull_request == null &&
        github.event.comment.body == 'ESCAPE_PROJECTS_INVENTORY_V1'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read existing project membership
        env:
          ESCAPE_PROJECTS_TOKEN: ${{ secrets.ESCAPE_PROJECTS_TOKEN }}
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          QUERY = '''query($cursor:String) {
            user(login:"hva73") {
              login
              projectV2(number:1) {
                number title closed
                items(first:100,after:$cursor,archivedStates:[ARCHIVED,NOT_ARCHIVED]) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    isArchived
                    content { ... on Issue { number repository { nameWithOwner } } }
                    fieldValueByName(name:"Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue { name }
                    }
                  }
                }
              }
            }
          }'''

          def fail(message):
              print('BLOCKED: ' + message)
              sys.exit(1)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          token = os.environ.pop('ESCAPE_PROJECTS_TOKEN', '')
          if not token:
              fail('Projects-secret mangler eller er ikke tilgængeligt for jobbet.')
          cursor = None
          seen = set()
          wanted = {1, *range(3, 17)}
          matches = {n: [] for n in wanted}
          opener = urllib.request.build_opener(NoRedirect())
          try:
              while True:
                  payload = json.dumps({'query': QUERY, 'variables': {'cursor': cursor}}).encode()
                  request = urllib.request.Request('https://api.github.com/graphql', data=payload,
                      headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json',
                               'Accept': 'application/vnd.github+json', 'User-Agent': 'escape-project-readonly'})
                  with opener.open(request, timeout=20) as response:
                      result = json.load(response)
                  if result.get('errors'):
                      fail('GitHub GraphQL afviste opslaget eller returnerede delvise data.')
                  user = result.get('data', {}).get('user') or {}
                  project = user.get('projectV2')
                  if user.get('login', '').lower() != 'hva73':
                      fail('Projektejer kunne ikke verificeres.')
                  if not project:
                      fail('Projekt 1 blev ikke returneret eller er ikke tilgængeligt.')
                  if project.get('number') != 1:
                      fail('Projektnummer kunne ikke verificeres.')
                  if project.get('closed') is not False:
                      fail('Projektet er lukket eller åben tilstand kunne ikke verificeres.')
                  page = project['items']
                  for item in page['nodes']:
                      content = item.get('content') or {}
                      number = content.get('number')
                      if isinstance(number, int) and (content.get('repository') or {}).get('nameWithOwner') == 'hva73/invest':
                          matches.setdefault(number, []).append(item)
                  if not page['pageInfo']['hasNextPage']:
                      break
                  cursor = page['pageInfo']['endCursor']
                  if not cursor or cursor in seen:
                      fail('Projektlisten er ufuldstændig.')
                  seen.add(cursor)
              for number in sorted(matches):
                  rows = matches[number]
                  if not rows:
                      print('ISSUE ' + str(number) + ': MISSING_FROM_VISIBLE_ITEMS')
                      continue
                  if len(rows) != 1:
                      fail('Der findes flere kort for et Issue; kræver manuel kontrol.')
                  status = (rows[0].get('fieldValueByName') or {}).get('name')
                  if not isinstance(status, str) or not status.strip() or len(status) > 80 or not all(c.isalnum() or c in ' -_/' for c in status) or token in status:
                      fail('Projektkortets status kunne ikke verificeres sikkert.')
                  state = 'ARCHIVED' if rows[0].get('isArchived') else 'ACTIVE'
                  print('ISSUE ' + str(number) + ': ' + state + ', status: ' + status)
              print('PASS: Inventar kun læst; ingen Issues eller status ændret.')
          except urllib.error.HTTPError as error:
              fail('GitHub API-afvisning (HTTP ' + str(error.code) + ').')
          except Exception:
              fail('Opslaget kunne ikke fuldføres; ingen rå svardata er logget.')
          PY
