name: ESCAPE release approval checks
on:
  pull_request:
    branches: [codex/escape-development]
permissions:
  contents: read
jobs:
  test:
    if: github.event.pull_request.head.ref == 'codex/issue57-app-approval'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest tests.test_release_approval tests.test_nordicway_app_release tests.test_app.Workflow.test_release_approval_requires_owner_session_csrf_and_exact_version tests.test_web_push.Push.test_release_notification_only_for_owner_with_current_candidate
      - run: node tests/test_push_service_worker.js
      - run: python tests/browser_release_approval.py
        env:
          ESCAPE_PLAYWRIGHT_MANAGED: '1'
          PYTHONPATH: .:tests
