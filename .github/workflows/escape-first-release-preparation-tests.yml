name: ESCAPE first-release preparation tests
on:
  pull_request:
    branches: [codex/escape-development]
permissions:
  contents: read
jobs:
  tests:
    if: github.repository == 'hva73/invest' && github.event.pull_request.head.ref == 'codex/issue57-first-release-preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Check out actual legacy bridge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c1b6db6ca1ded2f3a81601608bdfa455145798f2
          path: _legacy
          persist-credentials: false
      - name: Check out tested release fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 819a444668c5aff4a992fcee73666837264869f4
          path: _release
          persist-credentials: false
      - name: Test owner-side and legacy transition in temporary directories
        env:
          ESCAPE_TEST_LEGACY_BRIDGE: ${{ github.workspace }}/_legacy
          ESCAPE_TEST_RELEASE_REPO: ${{ github.workspace }}/_release
        run: python -m unittest tests.test_nordicway_prepare_first_release tests.test_nordicway_first_release_transition
