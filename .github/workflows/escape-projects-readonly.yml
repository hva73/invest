name: ESCAPE Projects read-only check

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-issue-4:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read project 1 and existing issue 4
        env:
          ESCAPE_PROJECTS_TOKEN: ${{ secrets.ESCAPE_PROJECTS_TOKEN }}
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          QUERY = '''query($cursor:String) {
            user(login:"hva73") {
              login
              projectV2(number:1) {
                number title closed
                items(first:100,after:$cursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    isArchived
                    content { ... on Issue { number repository { nameWithOwner } } }
                    fieldValueByName(name:"Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue { name }
                    }
                  }
                }
              }
            }
          }'''

          def fail(message):
              print('BLOCKED: ' + message)
              sys.exit(1)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          token = os.environ.pop('ESCAPE_PROJECTS_TOKEN', '')
          if not token:
              fail('Projects-secret mangler eller er ikke tilgængeligt for jobbet.')
          cursor = None
          seen = set()
          matches = []
          opener = urllib.request.build_opener(NoRedirect())
          try:
              while True:
                  payload = json.dumps({'query': QUERY, 'variables': {'cursor': cursor}}).encode()
                  request = urllib.request.Request('https://api.github.com/graphql', data=payload,
                      headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json',
                               'Accept': 'application/vnd.github+json', 'User-Agent': 'escape-project-readonly'})
                  with opener.open(request, timeout=20) as response:
                      result = json.load(response)
                  if result.get('errors'):
                      fail('GitHub GraphQL afviste opslaget eller returnerede delvise data.')
                  user = result.get('data', {}).get('user') or {}
                  project = user.get('projectV2')
                  if user.get('login', '').lower() != 'hva73':
                      fail('Projektejer kunne ikke verificeres.')
                  if not project:
                      fail('Projekt 1 blev ikke returneret eller er ikke tilgængeligt.')
                  if project.get('number') != 1:
                      fail('Projektnummer kunne ikke verificeres.')
                  if project.get('closed') is not False:
                      fail('Projektet er lukket eller åben tilstand kunne ikke verificeres.')
                  page = project['items']
                  for item in page['nodes']:
                      content = item.get('content') or {}
                      if content.get('number') == 4 and (content.get('repository') or {}).get('nameWithOwner') == 'hva73/invest':
                          matches.append(item)
                  if not page['pageInfo']['hasNextPage']:
                      break
                  cursor = page['pageInfo']['endCursor']
                  if not cursor or cursor in seen:
                      fail('Projektlisten er ufuldstændig.')
                  seen.add(cursor)
              if len(matches) != 1 or matches[0].get('isArchived'):
                  fail('Issue #4 blev ikke fundet entydigt som et aktivt projektkort.')
              value = matches[0].get('fieldValueByName') or {}
              status = value.get('name')
              if not isinstance(status, str) or not status.strip() or len(status) > 80 or not all(c.isalnum() or c in ' -_/' for c in status) or token in status:
                  fail('Projektkortets status kunne ikke verificeres sikkert.')
              print('PASS: Projekt hva73/1, Issue hva73/invest#4.')
              print('Aktuel status: ' + status)
          except urllib.error.HTTPError as error:
              fail('GitHub API-afvisning (HTTP ' + str(error.code) + ').')
          except Exception:
              fail('Opslaget kunne ikke fuldføres; ingen rå svardata er logget.')
          PY
