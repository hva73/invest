name: Isolated CABA sell end-to-end test
on:
  pull_request:
    branches: [codex/data-and-notification-prep]
permissions:
  contents: read
jobs:
  tests:
    if: github.event.pull_request.head.ref == 'codex/e2e-test-sell-182'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:tests
      ESCAPE_PLAYWRIGHT_MANAGED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_manual_sell_signal.py'
      - run: python -m unittest discover -s tests -p 'test_trade_service.py'
      - run: python -m unittest discover -s tests -p 'test_web_push.py'
      - run: node --check static/app.js
      - run: node --check static/engine-ui.js
      - run: node --check static/dashboard-ui.js
      - run: node --check static/trade-ui.js
      - run: node --check static/sw.js
      - run: python tests/browser_manual_sell_signal.py
      - run: python tests/browser_signal_push_detail.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: manual-test-sell-182
          path: visual-review/manual-caba-sell-test-390.png
          if-no-files-found: ignore
