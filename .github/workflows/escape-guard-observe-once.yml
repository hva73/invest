name: ESCAPE guarded SSH observation (disabled)
on:
  pull_request:
    branches: [codex/escape-development]
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.repository == 'hva73/invest' && github.event.pull_request.head.ref == 'codex/issue57-guard-observation' && github.actor_id == '351122234' }}
    runs-on: ubuntu-latest
    environment: ESCAPE_NORDICWAY_DEPLOY
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Start restricted observation window
        env:
          ESCAPE_OBSERVE_CHALLENGE: '2ef9bc25f9576c2eee8b3fe36af486e3ae51f916'
          NORDICWAY_VERIFIED_FINGERPRINT: 'SHA256:U8MQZwyzMoDmDyRnBIqFqN14BVifmGKNSi+7B8OACDI'
          NORDICWAY_PRIVATE_KEY: ${{ secrets.ESCAPE_NORDICWAY_DEPLOY_PRIVATE_KEY }}
          NORDICWAY_KEY_PASSPHRASE: ${{ secrets.ESCAPE_NORDICWAY_DEPLOY_PASSPHRASE }}
        run: |
          set -eu
          umask 077
          [ -n "$NORDICWAY_PRIVATE_KEY" ] || { printf '%s\n' 'Restricted SSH credential unavailable.'; exit 1; }
          NORDICWAY_KNOWN_HOST="$(ssh-keyscan -T 10 -t ed25519 -p 33 cp14.nordicway.dk 2>/dev/null | awk '$1 == "[cp14.nordicway.dk]:33"')"
          export NORDICWAY_KNOWN_HOST
          python tools/nordicway_hostkey.py
          eval "$(ssh-agent -s)" >/dev/null
          askpass="$RUNNER_TEMP/escape-ssh-askpass"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$NORDICWAY_KEY_PASSPHRASE"
          ASKPASS
          chmod 700 "$askpass"
          export SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          if ! printf '%s\n' "$NORDICWAY_PRIVATE_KEY" | ssh-add - >/dev/null 2>&1; then
            printf '%s\n' 'Restricted SSH credential unavailable.'
            exit 1
          fi
          unset NORDICWAY_PRIVATE_KEY NORDICWAY_KEY_PASSPHRASE
          PYTHONPATH=tools python tools/nordicway_guard_observe_hold.py
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python tests/test_guard_observe.py
