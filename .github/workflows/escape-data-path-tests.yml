name: ESCAPE EODHD data-path regressions
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [codex/escape-development]
permissions:
  contents: read
jobs:
  data-path:
    if: github.repository == 'hva73/invest' && (github.event.pull_request.head.ref == 'codex/issue-4-quote-time-collision' || github.event.pull_request.head.ref == 'codex/issue14-performance-reliability' || github.event.pull_request.head.ref == 'codex/issue57-release-management' || github.event.pull_request.head.ref == 'codex/issue14-scan-latency' || github.event.pull_request.head.ref == 'codex/issue14-ws-cap-telemetry' || github.event.pull_request.head.ref == 'codex/issue14-discovery-gate' || github.event.pull_request.head.ref == 'codex/issue4-batch-incomplete' || github.event.pull_request.head.ref == 'codex/issue4-trade-ties' || github.event.pull_request.head.ref == 'codex/issue4-us-recovery' || github.event.pull_request.head.ref == 'codex/issue3-position-scope' || github.event.pull_request.head.ref == 'codex/issue8-candidate-reassessment' || github.event.pull_request.head.ref == 'codex/issue13-exit-review-status' || github.event.pull_request.head.ref == 'codex/issue7-provider-diagnosis' || github.event.pull_request.head.ref == 'codex/issue14-missing-ws-metrics' || github.event.pull_request.head.ref == 'codex/issue8-action-currentness' || github.event.pull_request.head.ref == 'codex/issue54-quote-future-time' || github.event.pull_request.head.ref == 'codex/issue8-review-priority' || github.event.pull_request.head.ref == 'codex/issue3-context-budget-diagnostic' || github.event.pull_request.head.ref == 'codex/issue8-buy-rounding' || github.event.pull_request.head.ref == 'codex/issue14-nordic-identity' || github.event.pull_request.head.ref == 'codex/issue8-tradability-diagnostic' || github.event.pull_request.head.ref == 'codex/issue13-exit-journey' || github.event.pull_request.head.ref == 'codex/issue14-nordic-live-feeds' || github.event.pull_request.head.ref == 'codex/issue14-recovery-connection-reuse')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/escape-data-venv"
          "$RUNNER_TEMP/escape-data-venv/bin/python" -m pip install -r requirements.txt
      - name: Verify EODHD, HOT WATCH and push regressions
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_eodhd_feeds tests.test_feed_reuse tests.test_queue_recovery tests.test_admin_diagnostics tests.test_hotwatch_holdings_auto tests.test_hotwatch_warmup tests.test_signal_readiness tests.test_sparse_feed_recovery tests.test_hotwatch_engine tests.test_review_signal_fixes tests.test_web_push'
      - name: Verify same-timestamp trade handling
        if: github.event.pull_request.head.ref == 'codex/issue4-trade-ties'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_trade_ties'
      - name: Verify discovery query and gate regressions
        if: github.event.pull_request.head.ref == 'codex/issue14-discovery-gate'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_discovery_query tests.test_hotwatch_agreement tests.test_strategy_handoff'
      - name: Verify US feed identity and recovery
        if: github.event.pull_request.head.ref == 'codex/issue4-us-recovery'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_instrument_resolver tests.test_eodhd_us_reference tests.test_eodhd_symbol_lookup tests.test_hotwatch_holdings_auto'
      - name: Verify candidate position evidence
        if: github.event.pull_request.head.ref == 'codex/issue3-position-scope'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_candidate_lifecycle'
      - name: Verify release baseline and updater
        if: github.event.pull_request.head.ref == 'codex/issue57-release-management'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_app tests.test_updater'


      - name: Verify quote time and display-data regressions
        if: github.event.pull_request.head.ref == 'codex/issue54-quote-future-time'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_market_data tests.test_asset_quotes tests.test_portfolio_data tests.test_dashboard_snapshot_history'

      - name: Verify candidate review lifecycle
        if: github.event.pull_request.head.ref == 'codex/issue8-review-priority'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_hotwatch_e2e_contract tests.test_intel_workflows tests.test_hotwatch_agreement tests.test_mcp_reports tests.test_market_data tests.test_asset_quotes tests.test_portfolio_data tests.test_dashboard_snapshot_history'

      - name: Verify strict portfolio budget diagnostics
        if: github.event.pull_request.head.ref == 'codex/issue3-context-budget-diagnostic'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_portfolio_data'

      - name: Verify buy-plan rounding and trade gates
        if: github.event.pull_request.head.ref == 'codex/issue8-buy-rounding'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_hotwatch_buy_plan tests.test_trade_service tests.test_hotwatch_e2e_contract tests.test_portfolio_data'

      - name: Verify Nordic instrument recovery
        if: github.event.pull_request.head.ref == 'codex/issue14-nordic-identity'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_instrument_resolver tests.test_hotwatch_holdings_auto tests.test_hotwatch_agreement'

      - name: Verify tradability diagnostics and signal gates
        if: github.event.pull_request.head.ref == 'codex/issue8-tradability-diagnostic'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_tradability_diagnostics tests.test_hotwatch_engine tests.test_signal_readiness tests.test_instrument_resolver tests.test_hotwatch_holdings_auto tests.test_hotwatch_agreement'

      - name: Verify signal-guided direct sell gates
        if: github.event.pull_request.head.ref == 'codex/issue13-exit-journey'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_trade_service tests.test_hotwatch_e2e_contract'

      - name: Verify Nordic live data paths
        if: github.event.pull_request.head.ref == 'codex/issue14-nordic-live-feeds'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_eodhd_feeds tests.test_hotwatch_engine tests.test_hotwatch_supervisor tests.test_post_install_capacity tests.test_hotwatch_holdings_auto tests.test_instrument_resolver tests.test_trade_service tests.test_hotwatch_e2e_contract'

      - name: Verify read-only recovery connection reuse
        if: github.event.pull_request.head.ref == 'codex/issue14-recovery-connection-reuse'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_hotwatch_holdings_auto tests.test_hotwatch_agreement tests.test_hotwatch_engine tests.test_signal_readiness tests.test_portfolio_data tests.test_queue_recovery'
