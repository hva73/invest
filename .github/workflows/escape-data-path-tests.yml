name: ESCAPE EODHD data-path regressions
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [codex/escape-development]
permissions:
  contents: read
jobs:
  data-path:
    if: github.repository == 'hva73/invest' && (github.event.pull_request.head.ref == 'codex/issue-4-quote-time-collision' || github.event.pull_request.head.ref == 'codex/issue14-performance-reliability' || github.event.pull_request.head.ref == 'codex/issue57-release-management' || github.event.pull_request.head.ref == 'codex/issue14-scan-latency' || github.event.pull_request.head.ref == 'codex/issue14-ws-cap-telemetry' || github.event.pull_request.head.ref == 'codex/issue4-batch-incomplete' || github.event.pull_request.head.ref == 'codex/issue4-trade-ties' || github.event.pull_request.head.ref == 'codex/issue57-integrated-ci-645')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 645c293a5c484187a68d121a5cdd96c0a958bc86
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/escape-data-venv"
          "$RUNNER_TEMP/escape-data-venv/bin/python" -m pip install -r requirements.txt
      - name: Verify EODHD, HOT WATCH and push regressions
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_eodhd_feeds tests.test_feed_reuse tests.test_queue_recovery tests.test_admin_diagnostics tests.test_hotwatch_holdings_auto tests.test_hotwatch_warmup tests.test_signal_readiness tests.test_sparse_feed_recovery tests.test_hotwatch_engine tests.test_review_signal_fixes tests.test_web_push tests.test_trade_service tests.test_hotwatch_buy_plan tests.test_issue13_exit_currentness'
      - name: Verify same-timestamp trade handling
        if: github.event.pull_request.head.ref == 'codex/issue4-trade-ties' || github.event.pull_request.head.ref == 'codex/issue57-integrated-ci-645'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_trade_ties'
      - name: Verify release baseline and updater
        if: github.event.pull_request.head.ref == 'codex/issue57-release-management'
        env:
          PYTHONPATH: .:tests
        run: '"$RUNNER_TEMP/escape-data-venv/bin/python" -m unittest tests.test_app tests.test_updater'
      - name: Verify new assets backup and rollback
        env:
          PYTHONPATH: .:tests
        run: |
          "$RUNNER_TEMP/escape-data-venv/bin/python" - <<'PY'
          import json, sqlite3, tempfile
          from pathlib import Path
          from unittest.mock import patch
          import apply_update
          from tests.test_updater import Updater

          names = ('static/demo-data.js', 'static/desktop-experience.css')
          with tempfile.TemporaryDirectory() as d:
              source, target = Updater().fixture(Path(d))
              backup = apply_update.apply(source, target)
              records = json.loads((backup / 'manifest.json').read_text())
              assert all(records['files'][name] is None for name in names)
              assert all((target / name).is_file() for name in names)
              with sqlite3.connect(backup / 'escape.db') as c:
                  assert c.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
                  assert c.execute('SELECT value FROM preserved').fetchone()[0] == 'private-data'

          with tempfile.TemporaryDirectory() as d:
              source, target = Updater().fixture(Path(d))
              original = apply_update.os.replace
              def fail_at_desktop(src, dst):
                  if Path(dst) == target / names[1]:
                      raise OSError('synthetic replacement failure')
                  return original(src, dst)
              with patch('apply_update.os.replace', side_effect=fail_at_desktop):
                  try:
                      apply_update.apply(source, target)
                  except OSError as exc:
                      assert str(exc) == 'synthetic replacement failure'
                  else:
                      raise AssertionError('failure was not triggered')
              assert (target / 'app.py').read_text() == 'old code'
              assert all(not (target / name).exists() for name in names)
              with sqlite3.connect(target / 'var/escape.db') as c:
                  assert c.execute('SELECT value FROM preserved').fetchone()[0] == 'private-data'
              backup = next((target.parent / '.escape_backups').iterdir())
              records = json.loads((backup / 'manifest.json').read_text())
              assert all(records['files'][name] is None for name in names)
          print('NEW_ASSETS_BACKUP_AND_ROLLBACK_PASS')
          PY
