name: ESCAPE disposable ruleset test

on:
  workflow_dispatch:

permissions: {}

jobs:
  test-rules:
    if: >-
      github.repository == 'hva73/invest' &&
      github.actor_id == '351122234' &&
      github.ref == 'refs/heads/codex/escape-development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out reviewed test code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0370daeca174d5c2a9686b89201920b8fd29f5d5
          persist-credentials: false
      - name: Test only disposable branch protection
        env:
          RULE_TEST_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +x
          python3 development/projects_ruleset_disposable_test.py
