name: ESCAPE integration overflow verification
on:
  pull_request:
    branches: [codex/issue57-integrated-review]
permissions:
  contents: read
jobs:
  browser:
    if: github.event.pull_request.head.ref == 'codex/integration-overflow-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser journeys with synthetic data
        env:
          ESCAPE_PLAYWRIGHT_MANAGED: '1'
          PYTHONPATH: .:tests
        run: |
          python tests/browser_mobile_decision_overview.py
          python tests/browser_signal_push_detail.py
          python tests/browser_desktop_experience.py
          python tests/browser_sector_cash.py
          python tests/browser_sector_journey.py
          python tests/review_integrated_decision.py
