name: ESCAPE Projects status bridge

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: escape-projects-isolated-item-4-test
  queue: max
  cancel-in-progress: false

jobs:
  status-write:
    if: >-
      github.repository == 'hva73/invest' &&
      github.actor_id == '351122234' &&
      github.ref == 'refs/heads/codex/escape-development' &&
      github.run_attempt == '1' &&
      github.event.issue.pull_request == null &&
      (github.event.issue.number == 1 ||
       (github.event.issue.number >= 3 && github.event.issue.number <= 16)) &&
      startsWith(github.event.comment.body, 'ESCAPE_PROJECTS_WRITE_V1 ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out reviewed status bridge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0fbf24b4d87db08b660a803271cacab2335240f8
          persist-credentials: false
      - name: Process project status request
        env:
          ESCAPE_PROJECTS_TOKEN: ${{ secrets.ESCAPE_PROJECTS_TOKEN }}
          JOURNAL_TOKEN: ${{ github.token }}
          ISSUE_TOKEN: ${{ github.token }}
          PROJECT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUEST_COMMENT_ID: ${{ github.event.comment.id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 development/projects_status_write_entry.py

  report-failed-writer:
    needs: status-write
    if: >-
      always() &&
      (needs.status-write.result == 'failure' ||
       needs.status-write.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out reviewed failure reporter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0fbf24b4d87db08b660a803271cacab2335240f8
          persist-credentials: false
      - name: Report uncertain result
        env:
          ISSUE_TOKEN: ${{ github.token }}
          PROJECT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 development/projects_status_write_failure_report.py
