name: Mobile More keyboard QA (offline only)
on: [pull_request]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.ref == 'codex/issue54-mobile-more-keyboard'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:tests
      ESCAPE_PLAYWRIGHT_MANAGED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Negative control and fixed keyboard flow
        run: |
          git rev-parse HEAD
          cp static/index.html /tmp/fixed-index.html
          trap 'cp /tmp/fixed-index.html static/index.html' EXIT
          git show 3cc0c7bec83c529b2c3bb1011e5fcd7011f6ee65:static/index.html > static/index.html
          if python tests/browser_mobile_more_keyboard.py >/tmp/negative.log 2>&1; then
            cat /tmp/negative.log
            exit 1
          fi
          cat /tmp/negative.log
          grep -F 'AssertionError: disclosure tab skips first menu link' /tmp/negative.log
          cp /tmp/fixed-index.html static/index.html
          python tests/browser_mobile_more_keyboard.py
