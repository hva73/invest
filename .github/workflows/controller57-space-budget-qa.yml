name: Controller #57 generation 1 independent QA (offline only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e148fe4cb67826a67719e65821afe52d8a94b658
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: |
          test "$(git rev-parse HEAD)" = "e148fe4cb67826a67719e65821afe52d8a94b658"
          python -m unittest -v tests.test_release_space_budget
          python -m compileall -q release_space_budget.py
