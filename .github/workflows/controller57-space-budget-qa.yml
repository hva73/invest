name: Controller #57 generation 4 independent QA (offline only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ee271a39257d3f8259a42f2d196db55b302162c7
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: |
          test "$(git rev-parse HEAD)" = "ee271a39257d3f8259a42f2d196db55b302162c7"
          python -B -m unittest -v tests.test_nordicway_release_retention tests.test_nordicway_uapi_quota
          python -m py_compile tools/nordicway_release_retention.py
