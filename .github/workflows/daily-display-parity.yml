name: Daily display parity
on:
  pull_request:
permissions:
  contents: read
jobs:
  parity:
    if: github.event.pull_request.head.ref == 'codex/desktop-daily-data-143'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: node tests/test_dashboard_data.js
      - run: python tests/browser_daily_parity.py
      - run: python tests/browser_desktop_experience.py

      - name: Save comparison screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-parity-screens
          path: daily-parity-screens/*.png
          if-no-files-found: warn
