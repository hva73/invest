name: Statistics category interaction
on: pull_request
permissions:
  contents: read
jobs:
  interaction:
    if: github.event.pull_request.head.ref == 'codex/statistik-mobil-gevinst-tab'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: node tests/test_statistics_groups.cjs && python tests/browser_statistics_groups.py
