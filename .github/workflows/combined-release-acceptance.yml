name: Combined release acceptance (no production)
on: [pull_request]
permissions:
  contents: read
jobs:
  integration:
    if: github.event.pull_request.head.ref == 'codex/issue57-combined-release-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .:tests
      ESCAPE_PLAYWRIGHT_MANAGED: '1'
      ESCAPE_SCREENSHOTS: visual-review
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: HOT WATCH, provider, signals and statistics
        run: python -m unittest test_btc_market_session test_eodhd_feeds test_hotwatch_engine test_hotwatch_holdings_auto test_hotwatch_agreement test_hotwatch_bar_evidence test_hotwatch_warmup test_signal_readiness test_feed_empty_history_cache test_feed_intraday_exact_dedupe test_trade_service test_realized_statistics test_statistics_missing_cost test_statistics_origins test_statistics_gateway_reuse test_statistics_diagnostic test_statistics_dkk
      - name: Retention and research
        run: python -m unittest test_job_retention test_sqlite_storage_inspection test_nordicway_release_retention test_nordicway_maintenance_audit test_polymarket_intelligence
      - run: python -m unittest test_mobile_projection test_market_data
      - name: Frontend regressions
        run: |
          for f in tests/test_dashboard_data.js tests/test_nvda_daily_consistency.js tests/test_combined_holdings.js tests/test_sidebar_scope.js tests/test_admin_diagnostics_ui.cjs tests/test_diagnostics_live_ui.cjs tests/test_market_daily_stale.cjs tests/test_demo_chart_identity.cjs tests/test_statistics_ui.cjs; do node "$f" || exit 1; done
      - name: Browser journeys
        run: |
          mkdir -p visual-review
          failed=0
          for f in tests/browser_daily_parity.py tests/browser_position_entry_regression.py tests/browser_signal_push_detail.py tests/browser_sector_journey.py tests/browser_desktop_experience.py tests/browser_portfolio_value_chart.py tests/browser_statistics_ring_center.py tests/browser_demo_signal_parity.py tests/browser_statistics_integration.py; do python "$f" || failed=1; done
          exit "$failed"
  deployment_safety:
    if: github.event.pull_request.head.ref == 'codex/issue57-combined-release-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .:tests:tools
      ESCAPE_HW_AUTOSUPERVISE: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Isolated installer, rollback, approval, quota and recovery
        run: python -m unittest test_updater test_release_approval test_nordicway_deploy_request test_nordicway_deploy_client test_nordicway_app_release test_nordicway_release_preflight test_nordicway_uapi_quota test_nordicway_server_guard test_nordicway_readonly_diagnostics test_nordicway_release_retention test_nordicway_maintenance_audit
