name: Verify scoped statistics and demo hotfix
on:
  pull_request:
    branches: [hotfix/baseline-installed-3bdb49f1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest tests.test_realized_statistics tests.test_statistics_dkk tests.test_statistics_origins tests.test_statistics_missing_cost
      - run: node tests/test_statistics_ui.cjs
      - run: python tests/browser_statistics_integration.py
      - run: python tests/browser_anonymous_demo.py
      - run: python tests/browser_signal_push_detail.py
