name: ESCAPE cPanel quota probe
on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [codex/escape-development]
permissions:
  contents: read
jobs:
  tests:
    if: github.event_name == 'pull_request' && github.repository == 'hva73/invest'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_nordicway_uapi_probe
  probe:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'hva73/invest' &&
      github.event.issue.number == 16 &&
      github.event.comment.user.id == 351122234 &&
      github.event.comment.body == '/escape-uapi-probe'
    runs-on: ubuntu-latest
    environment: ESCAPE_NORDICWAY_DEPLOY
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/escape-development
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Inspect quota response shape
        env:
          ESCAPE_CPANEL_API_TOKEN: ${{ secrets.ESCAPE_CPANEL_API_TOKEN }}
        run: python tools/nordicway_uapi_probe.py
