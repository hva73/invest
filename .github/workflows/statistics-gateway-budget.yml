name: Statistics broker budget checks
on:
  pull_request:
    branches: [codex/data-and-notification-prep]
permissions:
  contents: read
jobs:
  statistics-budget:
    if: github.event.pull_request.head.ref == 'codex/statistics-gateway-budget-142'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=.:tests python -m unittest test_statistics_gateway_reuse test_realized_statistics test_statistics_diagnostic test_eodhd_capacity test_hotwatch_engine
