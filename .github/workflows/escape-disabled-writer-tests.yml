name: ESCAPE disabled status writer tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: >-
      github.repository == 'hva73/invest' &&
      github.actor_id == '351122234' &&
      github.ref == 'refs/heads/codex/escape-development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 143c8fed580fba41ec6fba637566c506aaf0233b
          persist-credentials: false
      - name: Run mock tests without Projects credentials
        run: >-
          python3 -m unittest
          tests.test_projects_status_write_integration
          tests.test_projects_status_write_readonly_probe
          tests.test_projects_status_write_entry
          tests.test_projects_status_write_audit
          tests.test_projects_status_write_runner
          tests.test_projects_status_write_prototype
          tests.test_projects_dryrun_feedback
          tests.test_projects_ruleset_disposable_test
          tests.test_projects_replay_claim
          tests.test_projects_dryrun
          tests.test_projects_replay_actions_test
