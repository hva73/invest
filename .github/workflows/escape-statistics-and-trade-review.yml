name: ESCAPE statistics preview and synthetic trading journey
on:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-statistics-preview:
    if: github.repository == 'hva73/invest' && github.event.pull_request.head.ref == 'codex/issue114-statistics'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: node tests/test_statistics_ui.cjs && python tests/browser_statistics_preview.py
        env:
          ESCAPE_SCREENSHOTS: ${{ runner.temp }}/statistics-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: statistics-synthetic-preview
          path: ${{ runner.temp }}/statistics-preview
  integrated-trade-journey:
    if: github.repository == 'hva73/invest' && github.event.pull_request.head.ref == 'codex/issue114-statistics'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8113c372c8905528a997e334eda2361379a30b77
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Synthetic quick trade and server proposal journeys
        env:
          ESCAPE_PLAYWRIGHT_MANAGED: '1'
          PYTHONPATH: .:tests
        run: |
          python tests/browser_quick_trade.py
          python - <<'PY'
          import pathlib
          source=pathlib.Path('tests/browser_trade_proposals.py').read_text()
          old="p.chromium.launch(executable_path='/usr/bin/chromium',headless=True,args=['--no-sandbox'])"
          if source.count(old)!=1: raise RuntimeError('browser launch hook changed')
          pathlib.Path('tests/_synthetic_proposals_managed.py').write_text(source.replace(old,'p.chromium.launch(headless=True)'))
          PY
          python tests/_synthetic_proposals_managed.py
