name: Chart data and interaction review
on: pull_request
permissions:
  contents: read
jobs:
  review:
    if: github.event.pull_request.head.ref == 'codex/chart-unified-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, dashboard-sector, market-signal-position, hotwatch]
    env:
      PYTHONPATH: .:tests
      ESCAPE_PLAYWRIGHT_MANAGED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - if: matrix.suite != 'unit'
        run: python -m playwright install --with-deps chromium
      - if: matrix.suite == 'unit'
        run: |
          node tests/test_chart_samples_pagination.cjs
          node tests/test_chart_source_selection.cjs
          node tests/test_market_daily_stale.cjs
          node tests/test_sector_ui.js
          python tests/test_portfolio_value_chart.py
          python -m unittest discover -s tests -p 'test_market_data.py'
          python -m unittest discover -s tests -p 'test_trade_service.py'
          python -m unittest discover -s tests -p 'test_eodhd_feeds.py'
      - if: matrix.suite == 'dashboard-sector'
        run: |
          python tests/browser_portfolio_value_chart.py
          python tests/browser_sector_holdings.py
          python tests/browser_graph_fidelity.py
      - if: matrix.suite == 'market-signal-position'
        run: |
          python tests/browser_market_charts.py
          python tests/browser_intraday_market_chart.py
          python tests/browser_signal_push_detail.py
          python tests/browser_position_chart_detail.py
      - if: matrix.suite == 'hotwatch'
        run: python tests/browser_hotwatch_chart_pagination.py
