name: Trade statistics diagnostic checks
on:
  pull_request:
    branches: [codex/issue57-integrated-review]
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.event.pull_request.head.ref == 'codex/issue142-statistics-diagnostic'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_realized_statistics.py'
      - run: python -m unittest discover -s tests -p 'test_statistics_diagnostic.py'
      - run: node tests/test_statistics_diagnostic.cjs
