name: Mobile signal visual preview
on:
  pull_request:
    branches: [codex/mobile-owner-feedback-54]
permissions:
  contents: read
jobs:
  preview:
    if: github.event.pull_request.head.ref == 'codex/mobile-signal-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capture synthetic signals
        env:
          ESCAPE_PLAYWRIGHT_MANAGED: '1'
          ESCAPE_SCREENSHOTS: /tmp/escape-signal-preview
          PYTHONPATH: .:tests
        run: |
          mkdir -p "$ESCAPE_SCREENSHOTS"
          node tests/test_sector_ui.js
          node tests/test_dashboard_data.js
          node tests/test_notification_ui.cjs
          python tests/browser_signal_push_detail.py
          python tests/browser_sector_cash.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: signal-preview
          path: /tmp/escape-signal-preview/
          if-no-files-found: ignore
          retention-days: 7
