name: Phase bridge 20GB integration QA (offline only)
on:
  pull_request:
    branches: [codex/issue57-combined-release-20261124]
permissions:
  contents: read
jobs:
  offline:
    if: github.event.pull_request.head.ref == 'codex/issue57-phase-separated-install-20gb'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 90caec4b8f7299c24c7a019448d0f6b74b72dfee
          path: bridge-history
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -p test_nordicway_phase_backup.py -v
