name: ESCAPE Nordicway read-only diagnostics
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: escape-nordicway-readonly
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.repository == 'hva73/invest' &&
      github.actor_id == '351122234' &&
      github.triggering_actor == 'hva73' &&
      github.ref == 'refs/heads/codex/escape-development' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && github.event.issue.number == 16 &&
        startsWith(github.event.comment.body, 'ESCAPE_SERVER_READONLY_V1 ')))
    runs-on: ubuntu-latest
    environment: ESCAPE_NORDICWAY_READONLY
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Validate request and verify host
        env:
          NORDICWAY_READONLY_AUTHORIZED: ${{ vars.ESCAPE_NORDICWAY_READONLY_AUTHORIZED }}
          NORDICWAY_KNOWN_HOST: ${{ secrets.ESCAPE_NORDICWAY_KNOWN_HOST }}
          NORDICWAY_VERIFIED_FINGERPRINT: ${{ secrets.ESCAPE_NORDICWAY_VERIFIED_FINGERPRINT }}
        run: |
          set -eu
          python tools/nordicway_request.py
          if [ "$NORDICWAY_READONLY_AUTHORIZED" != '1' ]; then
            printf '%s\n' 'Read-only diagnostics have not been enabled.'
            exit 1
          fi
          python tools/nordicway_hostkey.py
      - name: Run fixed redacted diagnostics
        env:
          NORDICWAY_READONLY_AUTHORIZED: ${{ vars.ESCAPE_NORDICWAY_READONLY_AUTHORIZED }}
          NORDICWAY_KNOWN_HOST: ${{ secrets.ESCAPE_NORDICWAY_KNOWN_HOST }}
          NORDICWAY_VERIFIED_FINGERPRINT: ${{ secrets.ESCAPE_NORDICWAY_VERIFIED_FINGERPRINT }}
          NORDICWAY_PRIVATE_KEY: ${{ secrets.ESCAPE_NORDICWAY_SSH_PRIVATE_KEY }}
          NORDICWAY_KEY_PASSPHRASE: ${{ secrets.ESCAPE_NORDICWAY_SSH_PASSPHRASE }}
        run: |
          set -eu
          umask 077
          if [ -z "$NORDICWAY_PRIVATE_KEY" ]; then
            printf '%s\n' 'The dedicated SSH credential is unavailable.'
            exit 1
          fi
          eval "$(ssh-agent -s)" >/dev/null
          askpass="$RUNNER_TEMP/escape-ssh-askpass"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$NORDICWAY_KEY_PASSPHRASE"
          ASKPASS
          chmod 700 "$askpass"
          export SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          if ! printf '%s\n' "$NORDICWAY_PRIVATE_KEY" | ssh-add - >/dev/null 2>&1; then
            printf '%s\n' 'The SSH credential could not be loaded.'
            exit 1
          fi
          unset NORDICWAY_PRIVATE_KEY NORDICWAY_KEY_PASSPHRASE
          python tools/nordicway_readonly_client.py
