name: Mobile warning geometry QA (no production)
on: [pull_request]
permissions:
  contents: read
jobs:
  browser:
    if: github.event.pull_request.head.ref == 'codex/issue54-mobile-warning-flow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:tests
      ESCAPE_PLAYWRIGHT_MANAGED: '1'
      ESCAPE_SCREENSHOTS: visual-review
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Negative control on original frozen stylesheet
        run: |
          cp static/desktop-experience.css /tmp/mobile-fixed.css
          trap 'cp /tmp/mobile-fixed.css static/desktop-experience.css' EXIT
          git show 3cc0c7bec83c529b2c3bb1011e5fcd7011f6ee65:static/desktop-experience.css > static/desktop-experience.css
          if python tests/browser_demo_signal_parity.py > /tmp/mobile-negative.log 2>&1; then
            cat /tmp/mobile-negative.log
            exit 1
          fi
          cat /tmp/mobile-negative.log
          grep -F 'mobile warning overlaps quote/ticker' /tmp/mobile-negative.log
      - name: Fixed mobile demo and shared authenticated flow
        run: |
          mkdir -p visual-review
          python tests/browser_demo_signal_parity.py
          python tests/browser_signal_push_detail.py
          git rev-parse HEAD > visual-review/product-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-warning-geometry
          path: visual-review/
          if-no-files-found: error
