name: Frozen signal and exit safety QA (no production)
on:
  pull_request:
    branches: [codex/issue57-combined-release-20261124]
permissions:
  contents: read
jobs:
  signal_safety:
    if: github.event.pull_request.head.ref == 'test/agent3-frozen-signal-safety-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '3cc0c7bec83c529b2c3bb1011e5fcd7011f6ee65'
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Assert exact frozen product revision
        run: test "$(git rev-parse HEAD)" = '3cc0c7bec83c529b2c3bb1011e5fcd7011f6ee65'
      - run: python -m pip install -r requirements.txt
      - name: Exit invalidation, push deduplication, risk sizing and pending order safety
        working-directory: tests
        env:
          PYTHONPATH: ..
        run: python -m unittest -v test_review_signal_fixes test_web_push test_hotwatch_buy_plan test_pending_orders test_hotwatch_supervisor test_candidate_lifecycle
      - name: Signal display and service worker boundaries
        run: |
          set -e
          for f in tests/test_engine_signal_colors.js tests/test_push_service_worker.js tests/test_signal_buy_context.cjs tests/test_signal_detail_context.cjs tests/test_signal_direction_guard.cjs tests/test_signal_explanation.js tests/test_signal_notice.js tests/test_statistics_missing_cost.cjs; do
            node "$f"
          done
