name: Empty history sharing checks
on:
  pull_request:
    branches: [codex/hotfix-combined-snapshot]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_history_empty_cache.py' -v
      - run: python -m unittest discover -s tests -p 'test_eodhd_feeds.py'
      - run: python -m unittest discover -s tests -p 'test_hotwatch_engine.py'
