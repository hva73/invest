name: Release statistics integration
on:
  pull_request:
permissions:
  contents: read
jobs:
  statistics:
    if: github.event.pull_request.head.ref == 'codex/data-and-notification-prep' || github.event.pull_request.head.ref == 'codex/statistics-budget-hotfix'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_realized_statistics.py'
      - run: python -m unittest discover -s tests -p 'test_statistics_missing_cost.py'
      - run: python -m unittest discover -s tests -p 'test_statistics_origins.py'
      - run: python -m unittest discover -s tests -p 'test_statistics_gateway_reuse.py'
      - run: python -m unittest discover -s tests -p 'test_statistics_diagnostic.py'
      - run: node tests/test_statistics_ui.cjs
      - run: node tests/test_statistics_missing_cost.cjs
      - run: python tests/browser_statistics_missing_cost.py
      - run: python tests/browser_statistics_integration.py
      - run: python tests/browser_statistics_desktop_accept.py
