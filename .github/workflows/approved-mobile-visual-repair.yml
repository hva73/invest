name: Approved mobile visual repair
on: [pull_request]
permissions:
  contents: read
jobs:
  review:
    if: contains(fromJSON('["codex/approved-mobile-visual-fix","codex/mobile-approved-parity-15nov"]'), github.event.pull_request.head.ref) || github.event.pull_request.head.ref == 'codex/data-and-notification-prep'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:tests
      ESCAPE_PLAYWRIGHT_MANAGED: '1'
      ESCAPE_SCREENSHOTS: visual-review
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_mobile_projection.py
      - run: node tests/test_dashboard_data.js
      - run: node tests/test_combined_holdings.js
      - run: node tests/test_sidebar_scope.js
      - run: node tests/test_admin_diagnostics_ui.cjs
      - run: node tests/test_diagnostics_live_ui.cjs
      - run: node tests/test_market_daily_stale.cjs
      - run: mkdir -p visual-review
      - run: python tests/browser_daily_parity.py
      - run: python tests/browser_position_entry_regression.py
      - run: python tests/browser_signal_push_detail.py
      - run: python tests/browser_sector_journey.py
      - name: Require visual evidence for five mobile views
        run: |
          test -s daily-parity-screens/oversigt-390.png
          test -s daily-parity-screens/position-390.png
          test -s visual-review/position-390.png
          test -s visual-review/signal-buy-390.png
          test -s visual-review/signal-sell-390.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approved-mobile-repair
          path: |
            visual-review/*.png
            daily-parity-screens/*.png
          if-no-files-found: warn
