name: ESCAPE first ticket compatibility tests
on:
  pull_request:
    branches: [codex/issue57-owner-approval]
permissions:
  contents: read
jobs:
  tests:
    if: github.repository == 'hva73/invest' && github.event.pull_request.head.ref == 'codex/issue57-legacy-ticket'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Test one-time owner ticket and existing client payload
        env:
          PYTHONPATH: tools:.
        run: python -m unittest tests.test_legacy_ticket_bootstrap tests.test_nordicway_owner_approval
