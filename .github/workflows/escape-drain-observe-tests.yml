name: ESCAPE drain observation offline tests
on:
  pull_request:
    branches: [codex/issue57-legacy-ticket]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Check out pinned pre-backup recovery for offline validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a99c805280879101503d190dc47cc2558e2f007b
          path: _recovery
          persist-credentials: false
      - name: Run isolated diagnostic tests
        env:
          PYTHONPATH: tools:_recovery/tools
        run: python -m unittest tests.test_passenger_classification tests.test_stop_observer tests.test_drain_diagnostic tests.test_drain_entry
