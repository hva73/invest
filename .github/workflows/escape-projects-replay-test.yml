name: ESCAPE Projects isolated replay test

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  test-replay:
    concurrency:
      group: escape-projects-isolated-item-4-test
      queue: max
      cancel-in-progress: false
    if: >-
      github.repository == 'hva73/invest' &&
      github.actor_id == '351122234' &&
      github.event.issue.number == 4 &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, 'ESCAPE_PROJECTS_DRYRUN_V1 ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out reviewed test code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ce7d37b88afa536c9728f38801bb4d8cf21ee315
          persist-credentials: false
      - name: Test validation and replay without Projects writes
        env:
          ESCAPE_PROJECTS_TOKEN: ${{ secrets.ESCAPE_PROJECTS_TOKEN }}
          JOURNAL_TOKEN: ${{ github.token }}
          REQUEST_COMMENT_ID: ${{ github.event.comment.id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set +x
          python3 development/projects_replay_actions_test.py

  report-dry-run:
    needs: test-replay
    if: >-
      always() &&
      needs.test-replay.result != 'skipped' &&
      github.repository == 'hva73/invest' &&
      github.actor_id == '351122234' &&
      github.event.issue.number == 4
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out reviewed feedback code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c1aa1038d6aafce31a1f8a91978a9adabb57904a
          persist-credentials: false
      - name: Document result on the issue
        env:
          FEEDBACK_TOKEN: ${{ github.token }}
          DRYRUN_RESULT: ${{ needs.test-replay.result }}
        run: python3 development/projects_dryrun_feedback.py
