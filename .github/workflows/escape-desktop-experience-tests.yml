name: ESCAPE desktop experience checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [codex/escape-development]
permissions:
  contents: read
jobs:
  desktop-experience:
    if: github.repository == 'hva73/invest' && github.event.pull_request.head.ref == 'codex/issue67-desktop-experience'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install browser test dependency
        run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test synthetic app and desktop layout
        env:
          ESCAPE_SCREENSHOTS: /tmp/escape-desktop-screens
          PYTHONPATH: .:tests
        run: |
          python -m unittest discover -s tests -p test_updater.py
          node tests/test_dashboard_data.js
          node tests/test_dashboard_attention.js
          node tests/test_signal_notice.js
          node tests/test_sidebar_scope.js
          node tests/test_sidebar_scope.js static/desktop-experience.css
          python tests/browser_desktop_experience.py
          python tests/browser_desktop_trade.py
      - name: Upload synthetic screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: escape-desktop-screens
          path: /tmp/escape-desktop-screens/
          if-no-files-found: ignore
          retention-days: 7
  decision-desktop-review:
    if: github.repository == 'hva73/invest' && github.event.pull_request.head.ref == 'codex/issue67-desktop-experience'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: desktop-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6a4d15346d09463dcc27707159c19d65d2cdc349
          path: decision-source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        working-directory: decision-source
        run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Review decision journey across widths
        env:
          ESCAPE_PLAYWRIGHT_MANAGED: '1'
          ESCAPE_SCREENSHOTS: /tmp/escape-decision-desktop
          PYTHONPATH: .:tests
        run: |
          mkdir -p "$ESCAPE_SCREENSHOTS"
          cp desktop-source/static/desktop-experience.css decision-source/static/desktop-experience.css
          cp desktop-source/tests/review_desktop_decision.py decision-source/tests/review_desktop_decision.py
          cd decision-source
          python tests/review_desktop_decision.py
      - name: Upload synthetic decision screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: escape-decision-desktop
          path: /tmp/escape-decision-desktop/
          if-no-files-found: ignore
          retention-days: 7
  demo-desktop-review:
    if: github.repository == 'hva73/invest' && github.event.pull_request.head.ref == 'codex/issue67-desktop-experience'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: desktop-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 50685e7efdba65f50ab45f7f412575b2dbc10eaf
          path: demo-source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        working-directory: demo-source
        run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Review desktop layout with demo branch
        env:
          ESCAPE_SCREENSHOTS: /tmp/escape-demo-desktop
          ESCAPE_DESKTOP_EXTERNAL_REVIEW: '1'
          PYTHONPATH: .:tests
        run: |
          mkdir -p "$ESCAPE_SCREENSHOTS"
          cp desktop-source/static/desktop-experience.css demo-source/static/desktop-experience.css
          cp desktop-source/tests/desktop_fixture.py demo-source/tests/desktop_fixture.py
          cp desktop-source/tests/browser_desktop_experience.py demo-source/tests/browser_desktop_experience.py
          cp desktop-source/tests/review_demo_desktop.py demo-source/tests/review_demo_desktop.py
          cd demo-source
          python tests/browser_desktop_experience.py
          python tests/review_demo_desktop.py
      - name: Upload synthetic screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: escape-demo-desktop
          path: /tmp/escape-demo-desktop/
          if-no-files-found: ignore
          retention-days: 7
