name: ESCAPE desktop experience checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [codex/escape-development]
permissions:
  contents: read
jobs:
  desktop-experience:
    if: github.repository == 'hva73/invest' && github.event.pull_request.head.ref == 'codex/issue67-desktop-experience'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install browser test dependency
        run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test synthetic app and desktop layout
        env:
          ESCAPE_SCREENSHOTS: /tmp/escape-desktop-screens
          PYTHONPATH: .:tests
        run: |
          node tests/test_dashboard_data.js
          node tests/test_dashboard_attention.js
          node tests/test_signal_notice.js
          python tests/browser_desktop_experience.py
      - name: Upload synthetic screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: escape-desktop-screens
          path: /tmp/escape-desktop-screens/
          if-no-files-found: ignore
          retention-days: 7
