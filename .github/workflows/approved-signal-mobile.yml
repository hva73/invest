name: Signal mobile validation
on: [pull_request]
permissions:
  contents: read
jobs:
  browser:
    if: github.event.pull_request.head.ref == 'codex/approved-signal-mobile-13'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_market_data.py
      - run: node tests/test_signal_detail_context.cjs
      - run: node tests/test_signal_buy_context.cjs
      - run: node tests/test_market_daily_stale.cjs
      - run: python tests/browser_signal_push_detail.py
      - run: python tests/browser_desktop_experience.py
