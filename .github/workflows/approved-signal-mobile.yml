name: Signal mobile validation
on: [pull_request]
permissions:
  contents: read
jobs:
  browser:
    if: github.event.pull_request.head.ref == 'codex/approved-signal-mobile-13'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:tests
      ESCAPE_PLAYWRIGHT_MANAGED: '1'
      ESCAPE_SCREENSHOTS: signal-review
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_market_data.py
      - run: node tests/test_signal_detail_context.cjs
      - run: node tests/test_signal_buy_context.cjs
      - run: node tests/test_market_daily_stale.cjs
      - run: mkdir -p signal-review
      - run: python tests/browser_signal_push_detail.py
      - run: python tests/browser_desktop_experience.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: signal-review
          path: signal-review/*.png
          if-no-files-found: ignore
