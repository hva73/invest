name: Agent 5 combined desktop visual QA (no production)
on: [pull_request]
permissions:
  contents: read
jobs:
  visual:
    if: github.event.pull_request.head.ref == 'codex/agent5-combined-232-visual-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:tests
      ESCAPE_PLAYWRIGHT_MANAGED: '1'
      ESCAPE_SCREENSHOTS: visual-review
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a053b7bc1bc0de5e0503194fe5e4b3283e33957
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Combined desktop and mobile frontend regression
        run: |
          set -e
          for f in tests/test_dashboard_data.js tests/test_nvda_daily_consistency.js tests/test_combined_holdings.js tests/test_sidebar_scope.js tests/test_market_daily_stale.cjs tests/test_demo_chart_identity.cjs tests/test_statistics_ui.cjs; do node "$f"; done
      - name: Combined desktop, sector, charts and signals
        run: |
          mkdir -p visual-review
          failed=0
          for f in tests/browser_daily_parity.py tests/browser_sector_journey.py tests/browser_desktop_experience.py tests/browser_portfolio_value_chart.py tests/browser_statistics_ring_center.py tests/browser_position_entry_regression.py tests/browser_signal_push_detail.py tests/browser_statistics_integration.py tests/browser_demo_signal_parity.py; do
            echo "Testing $f"
            python "$f" || failed=1
          done
          exit "$failed"
