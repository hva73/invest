name: Bounded storage census offline QA
on: [pull_request]
permissions:
  contents: read
jobs:
  offline:
    if: github.event.pull_request.head.ref == 'codex/issue14-bounded-live-storage-measurement'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B -m unittest tests.test_inspect_live_storage_bounded -v
