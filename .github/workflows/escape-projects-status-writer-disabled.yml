name: ESCAPE approved Issue 4 restoration

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: escape-projects-isolated-item-4-test
  queue: max
  cancel-in-progress: false

jobs:
  approved-single-test:
    if: >-
      github.repository == 'hva73/invest' &&
      github.actor_id == '351122234' &&
      github.ref == 'refs/heads/codex/escape-development' &&
      github.run_attempt == '1' &&
      github.event.issue.number == 4 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == 'ESCAPE_PROJECTS_WRITE_V1 {"request_id":"8f104c1ecc5e456d99f54572e6e17d87","expected_status":"Backlog","desired_status":"In progress"}'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out immutable one-shot revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b9f2b456cb80a23733bf0465415e02cecc49823e
          persist-credentials: false
      - name: Execute only approved Issue 4 transition
        env:
          ESCAPE_PROJECTS_TOKEN: ${{ secrets.ESCAPE_PROJECTS_TOKEN }}
          JOURNAL_TOKEN: ${{ github.token }}
          ISSUE_TOKEN: ${{ github.token }}
          REQUEST_COMMENT_ID: ${{ github.event.comment.id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 development/projects_status_single_test.py

  report-failed-test:
    needs: approved-single-test
    if: >-
      always() &&
      (needs.approved-single-test.result == 'failure' ||
       needs.approved-single-test.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out immutable failure reporter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b9f2b456cb80a23733bf0465415e02cecc49823e
          persist-credentials: false
      - name: Report uncertain test outcome
        env:
          ISSUE_TOKEN: ${{ github.token }}
          PROJECT_ISSUE_NUMBER: '4'
        run: python3 development/projects_status_write_failure_report.py
