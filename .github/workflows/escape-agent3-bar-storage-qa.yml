name: ESCAPE agent3 bar storage QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [codex/issue57-combined-release-20261124]
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'hva73/invest' && github.event.pull_request.head.ref == 'codex/agent3-bar-history-exact-dedupe-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Exact head and offline storage tests
        env:
          PYTHONPATH: .:tests
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m unittest -v tests.test_hotwatch_engine.HotWatch.test_exact_bar_dictionary_preserves_full_samples_and_replay tests.test_hotwatch_engine.HotWatch.test_bar_dictionary_rejects_corrupt_payload_and_keeps_invalid_bars_inline
      - name: Existing safety regression
        env:
          PYTHONPATH: .:tests
        run: python -m unittest tests.test_hotwatch_engine tests.test_hotwatch_bar_evidence tests.test_hotwatch_buy_plan tests.test_web_push tests.test_hotwatch_warmup tests.test_strategy_center tests.test_eodhd_feeds
