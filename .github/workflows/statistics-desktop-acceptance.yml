name: Desktop statistics acceptance
on:
  pull_request:
    paths:
      - 'static/statistics-ui.js'
      - 'static/statistics.css'
      - 'tests/browser_statistics_desktop_accept.py'
      - 'tests/test_statistics_desktop_review.cjs'
      - '.github/workflows/statistics-desktop-acceptance.yml'
jobs:
  desktop:
    runs-on: ubuntu-24.04
    env:
      ESCAPE_SCREENSHOTS: /tmp/escape-statistics-desktop
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: mkdir -p "$ESCAPE_SCREENSHOTS" && node tests/test_statistics_desktop_review.cjs && node tests/test_statistics_ui.cjs && python -m unittest discover -s tests -p test_realized_statistics.py && python tests/browser_statistics_desktop_accept.py && python tests/browser_statistics_preview.py && python tests/browser_statistics_integration.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: statistics-desktop-synthetic
          path: /tmp/escape-statistics-desktop/
          if-no-files-found: ignore
